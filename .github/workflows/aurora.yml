# The Aurora build of this fork: the `aurora` branch, Polyfin with the Aurora look of the admin app.
# Each day it merges Polyfin's main branch, then publishes ghcr.io/<owner>/polyfin:aurora when
# anything changed. A merge that conflicts fails the run, and the branch stays as it was.
name: Aurora image

on:
  push:
    branches: [aurora]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: aurora
  cancel-in-progress: false

jobs:
  image:
    name: Merge Polyfin and publish the image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the aurora branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: aurora
          fetch-depth: 0

      - name: Merge Polyfin's main branch
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/moodiness/polyfin.git
          git fetch --quiet --tags upstream main
          before=$(git rev-parse HEAD)
          git merge --no-edit upstream/main
          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            git push origin HEAD:aurora
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$(git describe --tags --abbrev=0 upstream/main)-aurora" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        if: github.event_name != 'schedule' || steps.merge.outputs.changed == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        if: github.event_name != 'schedule' || steps.merge.outputs.changed == 'true'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin

      - name: Choose image tags
        if: github.event_name != 'schedule' || steps.merge.outputs.changed == 'true'
        id: tags
        env:
          VERSION: ${{ steps.merge.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "tags<<TAGS"
            echo "${image}:aurora"
            echo "${image}:${VERSION}"
            echo "${image}:sha-$(git rev-parse --short HEAD)"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push linux/amd64 and linux/arm64
        if: github.event_name != 'schedule' || steps.merge.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.merge.outputs.version }}
          labels: |
            org.opencontainers.image.title=Polyfin Aurora
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.merge.outputs.version }}
            org.opencontainers.image.licenses=MIT
