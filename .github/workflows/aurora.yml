# The Aurora build of this fork: the `aurora` branch, Polyfin with the Aurora look of the admin app.
# Each push publishes ghcr.io/<owner>/polyfin:aurora from exactly what was pushed: Polyfin's main
# branch is merged by hand, its conflicts resolved, before pushing.
name: Aurora image

on:
  push:
    branches: [aurora]
  workflow_dispatch:

concurrency:
  group: aurora
  cancel-in-progress: false

jobs:
  image:
    name: Publish the image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the aurora branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: aurora
          fetch-depth: 0

      # The version of the last Polyfin release merged: its tags are Polyfin's.
      - name: Read the version
        id: version
        run: |
          git fetch --quiet --tags https://github.com/moodiness/polyfin.git main
          echo "version=$(git describe --tags --abbrev=0 HEAD)-aurora" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin

      - name: Choose image tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "tags<<TAGS"
            echo "${image}:aurora"
            echo "${image}:${VERSION}"
            echo "${image}:sha-$(git rev-parse --short HEAD)"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push linux/amd64 and linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=Polyfin Aurora
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
